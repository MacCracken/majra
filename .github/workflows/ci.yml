name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `cyrius lib sync` populates ./lib/ from the version-pinned snapshot,
  # which then shadows the global ~/.cyrius/versions/<V>/lib snapshot
  # on every subsequent `cyrius build` invocation. That's intentional
  # (the cwd lib IS the version-pinned snapshot content), but cyrius
  # emits an informational note about it on every build. Silence it
  # across all CI steps. Same pattern as agnosys CI post-5.10.x.
  CYRIUS_NO_WARN_SHADOW_LIB: "1"

  # Whole-program dead-code elimination — keeps binaries lean and
  # matches the agnosys/agnostik CI pattern.
  CYRIUS_DCE: "1"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Use the upstream installer — it resolves the cyrius.cyml pin,
        # fetches the OS-matched release tarball, and lays out
        # ~/.cyrius/versions/<VERSION>/{bin,lib} (+ the active symlinks)
        # with the correct binary names. We do NOT hand-extract: the
        # compiler binary is `cycc` (the `cc5` back-compat symlink was
        # dropped at cyrius v6.1.0), and the stdlib snapshot the installer
        # lays down under versions/<V>/lib is what `cyrius lib sync` reads.
        run: |
          set -e
          CYRIUS_VERSION="$(grep -E '^cyrius[[:space:]]*=' cyrius.cyml | head -1 | sed -E 's/^cyrius[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          "$HOME/.cyrius/bin/cyrius" --version

      - name: Resolve dependencies
        # Cyrius 6.x splits stdlib from git deps:
        #   `cyrius lib sync --full` copies the WHOLE version-pinned stdlib
        #     snapshot (incl slice/ct/chrono/async/sakshi/dynlib/fdlopen/sys
        #     — the modules sigil/sandhi reach into) into ./lib/. A bare
        #     `lib sync` copies only the declared [deps].stdlib subset, and
        #     a partial ./lib/ makes a missing toolchain module resolve to a
        #     `ud2` SIGILL at runtime.
        #   `cyrius deps` resolves nothing (majra declares no git deps since
        #     2.6.8) but is what verifies cyrius.lock: one hash per synced
        #     file plus the `cyrius <pin>` trailer (cyrius 6.6.4+ stamps it).
        #     File counts and the pin live in docs/development/state.md.
        # Build steps below pass --no-deps so `cyrius build`'s auto-deps
        # doesn't re-resolve and perturb the synced lib's include order.
        run: |
          cyrius lib sync --full
          cyrius deps

      - name: Verify dep hashes
        # Skip if cyrius.lock isn't in the tree yet — first push that
        # introduces deps has to land the lockfile before this gate
        # can enforce. After it lands, enforce hash match.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Manifest completeness ([lib] modules ⊇ main.cyr src/ includes)
        run: |
          # Every `include "src/<file>.cyr"` in src/main.cyr must be listed under
          # cyrius.cyml [lib] modules. Otherwise `cyrius distlib` silently ships
          # dist/majra.cyr missing a module, and the freshness gate below can't
          # see it (manifest is both input and oracle). Mirrors libro's guard.
          INCLUDES=$(grep -E 'include "src/[^"]+\.cyr"' src/main.cyr \
            | sed -E 's/.*"(src\/[^"]+\.cyr)".*/\1/' | sort -u)
          MANIFEST=$(awk '/^\[lib\]/{flag=1;next} /^\[/{flag=0} flag' cyrius.cyml \
            | grep -oE '"src/[^"]+\.cyr"' | tr -d '"' | sort -u)
          MISSING=$(comm -23 <(echo "$INCLUDES") <(echo "$MANIFEST"))
          if [ -n "$MISSING" ]; then
            echo "FAIL: src/ files included from main.cyr but not in cyrius.cyml [lib] modules:"
            echo "$MISSING"
            exit 1
          fi
          echo "Manifest covers all main.cyr src/ includes."

      - name: Build
        run: |
          mkdir -p build
          cyrius build --no-deps src/main.cyr build/majra
          echo "majra: $(wc -c < build/majra) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/majra | grep -q "7f45 4c46"

      - name: Raw syscall literal gate
        # 2.7.3 removed three raw x86_64 syscall numbers that ran as
        # DIFFERENT syscalls on aarch64 (fchmod 91→capset, getrandom 318→
        # ENOSYS, nanosleep 35→unlinkat); two of the three emitted no
        # build-time warning on any toolchain, and this lane is x86-only,
        # so the assertions 2.7.3 added only catch a reintroduction when
        # run on aarch64. This grep is the belt: no `syscall(<number>` in
        # code (comments excepted), and no `var SYS_*` outside the five
        # ESYSXLAT-routed networking rows src/ipc.cyr keeps target-neutral.
        run: |
          set -e
          hits=$(grep -rnE 'syscall\([0-9]' src tests fuzz benches examples | grep -vE ':[[:space:]]*#' || true)
          if [ -n "$hits" ]; then
            echo "FAIL: raw syscall literal(s) in code — spell the peer's SYS_* name or call the wrapper:"
            echo "$hits"; exit 1
          fi
          vars=$(grep -rnE '^var _?[A-Z_]*SYS_' src | grep -vE 'src/ipc\.cyr:[0-9]+:var (_SYS_(SOCKET|CONNECT|ACCEPT|BIND|LISTEN|SHUTDOWN) = (41|42|43|49|50|48)|_IPC_SYS_SENDTO = (44|206));$' || true)
          if [ -n "$vars" ]; then
            echo "FAIL: syscall number declared in arch-neutral code (only src/ipc.cyr's routed rows and per-arch sendto are allowed):"
            echo "$vars"; exit 1
          fi
          echo "no raw syscall literals; no stray SYS_ declarations"

      - name: Cross-build gate (aarch64, agnos)
        # Build-only, and cheap: a `duplicate symbol 'SYS_…' redefined` or
        # raw-syscall diagnostic is what a stray x86_64 number looks like at
        # build time when it looks like anything at all. aarch64 binaries
        # also RUN, in the aarch64-qemu job below — that is what caught the
        # 2.7.3 defects. agnos has no runner, so its column proves linking
        # only; the backends and patra-queue suites joined it at 2.12.2.
        run: |
          set -e
          fail=0
          for target in aarch64 agnos; do
            for entry in src/main.cyr tests/test_core.tcyr tests/test_backends.tcyr tests/test_patra_queue.tcyr; do
              out=$(cyrius build --$target --no-deps "$entry" build/${target}_probe 2>&1) || { echo "FAIL: $target cross-build of $entry"; echo "$out"; fail=1; continue; }
              if echo "$out" | grep -qE "duplicate symbol 'SYS_|redefined with conflicting value|raw syscall|undefined function"; then
                echo "FAIL: $target cross-build of $entry emitted a syscall/symbol diagnostic:"
                echo "$out" | grep -E "duplicate symbol 'SYS_|redefined with conflicting value|raw syscall|undefined function"
                fail=1
              fi
              echo "  $entry: $target ELF ok"
            done
          done
          [ $fail -eq 0 ] || exit 1
          xxd -l 20 build/aarch64_probe | grep -q "b700" && echo "e_machine = AArch64"

      - name: Core tests
        run: ./build/majra

      - name: Expanded tests
        run: |
          cyrius build --no-deps tests/test_core.tcyr build/test_core
          ./build/test_core

      - name: Backend tests
        run: |
          cyrius build --no-deps tests/test_backends.tcyr build/test_backends
          ./build/test_backends

      - name: Patra-queue tests
        # Separate entry point — adding these assertions to
        # test_backends.tcyr blew the cyrius fixup cap on the
        # cc3 line; under cc5 there's more headroom but the
        # split entry is documented architecture.
        run: |
          cyrius build --no-deps tests/test_patra_queue.tcyr build/test_patra_queue
          ./build/test_patra_queue

      - name: Fuzz
        run: |
          for f in fuzz/*.fcyr; do
            name=$(basename "$f" .fcyr)
            cyrius build --no-deps "$f" "build/$name"
            timeout 10 "build/$name" 500 || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
          done

      - name: Benchmarks
        run: |
          for f in benches/*.bcyr; do
            name=$(basename "$f" .bcyr)
            cyrius build --no-deps "$f" "build/$name"
            "build/$name"
          done

      - name: Examples
        run: |
          cyrius build --no-deps examples/managed_queue.cyr build/managed_queue
          ./build/managed_queue
          cyrius build --no-deps examples/pubsub_tiers.cyr build/pubsub_tiers
          ./build/pubsub_tiers

      - name: dist bundles are up-to-date
        # Four profile bundles need to stay in sync with src/:
        #   majra.cyr           — core engine (default [lib])
        #   majra-signed.cyr    — core + signed_envelope ([lib.signed])
        #   majra-admin.cyr     — core + admin endpoint ([lib.admin])
        #   majra-backends.cyr  — everything ([lib.backends])
        # Each `cyrius distlib <profile>` reads the matching
        # [lib.<profile>] section in cyrius.cyml. Self-compile check
        # warns about stdlib symbols (consumers supply their own
        # stdlib) — bundle still emitted; we only fail on a stale
        # diff. Mirrors libro DEPS-PATTERN.md.
        run: |
          cyrius distlib          || true
          cyrius distlib signed   || true
          cyrius distlib admin    || true
          cyrius distlib backends || true
          fail=0
          for bundle in dist/majra.cyr dist/majra-signed.cyr dist/majra-admin.cyr dist/majra-backends.cyr; do
            test -s "$bundle" || { echo "FAIL: $bundle not produced"; fail=1; continue; }
            if ! git diff --exit-code "$bundle"; then
              echo "FAIL: $bundle is stale. Run 'cyrius distlib [<profile>]' and commit."
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "all 4 dist bundles match src/"

  aarch64-qemu:
    name: aarch64 under qemu-user
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Upstream installer — see build-and-test job for rationale.
        run: |
          set -e
          CYRIUS_VERSION="$(grep -E '^cyrius[[:space:]]*=' cyrius.cyml | head -1 | sed -E 's/^cyrius[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Install qemu-aarch64 (11.1.3, pinned)
        # Not the runner's apt qemu-user: Ubuntu 24.04 ships 8.2.2, whose
        # page_check_range races another thread's munmap and fails a valid
        # read/write with EFAULT (qemu e03b7dac65, first in 11.1.0). Debian's
        # static build, hash-pinned. Why: CHANGELOG [2.12.3].
        env:
          QEMU_DEB: qemu-user_11.1.3+ds-1_amd64.deb
          QEMU_SHA256: 5fa915e759f314400cf7d64a2745747e6baa50a180c938b3e8d281ce57ede452
        run: |
          set -e
          deb="$RUNNER_TEMP/$QEMU_DEB"
          for url in \
            "https://snapshot.debian.org/archive/debian/20261029T211301Z/pool/main/q/qemu/qemu-user_11.1.3%2Bds-1_amd64.deb" \
            "https://deb.debian.org/debian/pool/main/q/qemu/qemu-user_11.1.3%2Bds-1_amd64.deb"; do
            curl -sSfL --retry 3 -o "$deb" "$url" && echo "$QEMU_SHA256  $deb" | sha256sum -c - && break
            rm -f "$deb"
          done
          [ -f "$deb" ] || { echo "::error::could not fetch $QEMU_DEB with sha256 $QEMU_SHA256"; exit 1; }
          dpkg-deb --fsys-tarfile "$deb" | tar -x -C "$RUNNER_TEMP" ./usr/bin/qemu-aarch64
          sudo install -m 0755 "$RUNNER_TEMP/usr/bin/qemu-aarch64" /usr/local/bin/qemu-aarch64
          # The loop below calls bare `qemu-aarch64`: fail here if PATH finds any other.
          [ "$(command -v qemu-aarch64)" = /usr/local/bin/qemu-aarch64 ]
          qemu-aarch64 --version | head -1 | tee /dev/stderr | grep -q "version 11\.1\.3 "

      - name: Resolve deps
        # Same snapshot serves both arches — `--aarch64` picks the peer
        # stdlib and the emitter. See build-and-test "Resolve dependencies".
        run: |
          cyrius lib sync --full
          cyrius deps

      - name: Suites under qemu-aarch64, looped
        # cyrius's aarch64 backend passes every syscall number outside its
        # ESYSXLAT table through verbatim, so a stray x86_64 number is a
        # different, valid syscall — two of 2.7.3's three built without a
        # warning. Only running catches that class. Looped because a single
        # green run hid 2.7.3's ~7 % barrier crash. SEQUENTIAL: the suites
        # use fixed /tmp paths and concurrent copies clobber each other.
        run: |
          set -e
          mkdir -p build
          LOOPS=25
          fail=0
          for pair in src/main.cyr:majra tests/test_core.tcyr:test_core tests/test_backends.tcyr:test_backends tests/test_patra_queue.tcyr:test_patra_queue; do
            entry=${pair%%:*}; name=${pair##*:}
            cyrius build --aarch64 --no-deps "$entry" "build/${name}_aarch64"
            bad=0
            for i in $(seq $LOOPS); do
              qemu-aarch64 "./build/${name}_aarch64" > "build/${name}_aarch64.log" 2>&1 || {
                rc=$?; bad=$((bad + 1))
                echo "::error::$name run $i/$LOOPS exited $rc (139 = SIGSEGV)"
                tail -20 "build/${name}_aarch64.log"
              }
            done
            echo "  $name: $((LOOPS - bad)) / $LOOPS clean — $(grep -E '[0-9]+ passed' "build/${name}_aarch64.log" | tail -1)"
            [ $bad -eq 0 ] || fail=1
          done
          [ $fail -eq 0 ] || exit 1

      - name: Fuzz + examples under qemu-aarch64
        run: |
          set -e
          for f in fuzz/*.fcyr; do
            name=$(basename "$f" .fcyr)
            cyrius build --aarch64 --no-deps "$f" "build/${name}_aarch64"
            timeout 60 qemu-aarch64 "./build/${name}_aarch64" 500 || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
          done
          for f in examples/managed_queue.cyr examples/pubsub_tiers.cyr; do
            name=$(basename "$f" .cyr)
            cyrius build --aarch64 --no-deps "$f" "build/${name}_aarch64"
            qemu-aarch64 "./build/${name}_aarch64"
          done

  live-tests:
    name: Live Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: majra
          POSTGRES_DB: majra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Upstream installer — see build-and-test job for rationale.
        run: |
          set -e
          CYRIUS_VERSION="$(grep -E '^cyrius[[:space:]]*=' cyrius.cyml | head -1 | sed -E 's/^cyrius[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve deps
        # Cyrius 6.x: stdlib snapshot via `cyrius lib sync`, git deps via
        # `cyrius deps`. See build-and-test "Resolve dependencies".
        run: |
          cyrius lib sync --full
          cyrius deps

      - name: Configure PostgreSQL auth
        run: |
          PGID=$(docker ps -q --filter "ancestor=postgres:16-alpine")
          docker exec "$PGID" su postgres -c \
            "echo 'host all all 0.0.0.0/0 password' > /var/lib/postgresql/data/pg_hba.conf && \
             echo 'local all all trust' >> /var/lib/postgresql/data/pg_hba.conf && \
             pg_ctl reload -D /var/lib/postgresql/data"

      - name: Run live tests
        run: |
          mkdir -p build
          cyrius build --no-deps tests/test_live.tcyr build/test_live
          ./build/test_live

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        run: |
          WARN=0
          if grep -rn 'syscall(59' src/ 2>/dev/null | grep -v "# "; then
            echo "WARN: raw execve"; WARN=1
          fi
          if grep -rn '"/etc/' src/ 2>/dev/null; then
            echo "WARN: hardcoded /etc paths"; WARN=1
          fi
          echo "security scan complete (warnings: $WARN)"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md CLAUDE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md LICENSE VERSION cyrius.cyml; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          CYML_VERSION=$(grep '^version = ' cyrius.cyml | head -1 | sed -E 's/version = "([^"]+)".*/\1/')
          # cyrius.cyml uses ${file:VERSION} — treat the literal as "match"
          if [ "$CYML_VERSION" != '${file:VERSION}' ] && [ "$CYML_VERSION" != "$FILE_VERSION" ]; then
            echo "FAIL: VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_VERSION)"
            exit 1
          fi
          grep -q "\[$FILE_VERSION\]" CHANGELOG.md || { echo "FAIL: version $FILE_VERSION not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION"
